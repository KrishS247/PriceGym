[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price-gym"
version = "0.1.0"
description = "Production-grade Reinforcement Learning dynamic pricing simulator, benchmarking suite, and low-latency ONNX inference service for e-commerce."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PriceGym Team"}
]
dependencies = [
    "gymnasium>=1.3.0",
    "stable-baselines3>=2.9.2",
    "torch>=2.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "tensorboard>=2.17.0",
    "matplotlib>=3.9.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
